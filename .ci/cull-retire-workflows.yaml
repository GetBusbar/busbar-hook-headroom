# busbar-hook-headroom: a minimal per-branch config that judges the PR retiring the workflow files
# (cull-retire-workflows). One trivial check; no other branch of this repo has a config.
to: main
on_green: merge
deadline: 2h
on:
  move: [noop]
checks:
  noop:
    env_from_run: []
    priority: low
    run: |
      git diff --stat HEAD~1 >/dev/null || true; echo ok
