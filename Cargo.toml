# SPDX-License-Identifier: Apache-2.0
#
# A twin repo (every plugin repo is one): this workspace is exactly two crates, the logic (the rlib a
# busbar build links; its only public item is `door`) and the thin cdylib that packages it as a
# droppable `kind: hook` plugin (crate `busbar-hook-headroom-plugin`). Its busbar dependencies are
# busbar-contract and, dev-only for the both-ways conformance test, busbar-plugin-loader: git
# dependencies on GetBusbar/busbar at the pin in `.busbar-ref`.
[workspace]
resolver = "2"
members = [
    "hook-headroom",
    "hook-headroom-plugin",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/busbar-hook-headroom"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "cf5642e0a8077287c7a0065f45c31dda92192f88" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "cf5642e0a8077287c7a0065f45c31dda92192f88" }
