[package]
name = "busbar-hook-headroom"
version = "2.0.22"
edition = "2024"
publish = false
description = "busbar first-party kind:hook plugin (dlopen cdylib): compresses LLM chat history with the real headroom-core BM25 TextCrusher engine as a prompt:rw rewrite gate."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# headroom-core with `default-features = false` — the lexical (BM25 TextCrusher) build, with the
# ONNX stack (ort/fastembed/magika) feature-gated OUT. This hook only needs TextCrusher, so the
# lexical build is ~7x smaller (29MB -> ~3MB) and avoids the ONNX-in-distroless slow path. The
# `ml`-feature gate landed UPSTREAM in headroomlabs-ai/headroom#2165, and the pin is an upstream
# release lineage that contains it. The exact upstream SQLite fix below upgrades bundled SQLite
# through rusqlite 0.41 (headroomlabs-ai/headroom#4658). Update the revision and lock together
# on `dev` (RELEASING.md); keep this lexical build free of the default ML feature.
headroom-core = { git = "https://github.com/headroomlabs-ai/headroom", rev = "74b7ac23861944f1411d30c5394043ec0505b334", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The ONE busbar crate this plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into
# it as `busbar_contract::abi::sdk`, so the hook trait, the export macro and the hook shapes all come
# from here). A git dependency on GetBusbar/busbar pinned to the rev in `.busbar-ref` field 1; a busbar
# build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "4c9bbcb15dc64f57d9cf1480025297a63903b289" }

[dev-dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "4c9bbcb15dc64f57d9cf1480025297a63903b289", features = ["test-seal"] }
tokio = { version = "1", features = ["rt", "macros"] }
# The REAL loader (dev-only, never in the shipped artifact): the e2e and the linked/dropped-in
# conformance tests open the built cdylib through it. Same pinned rev as busbar-contract above, so one
# busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "4c9bbcb15dc64f57d9cf1480025297a63903b289", features = ["test-support"] }
# Dev-only: the real-admin-API e2e test builds+drives an actual `busbar` process over HTTP (install
# a signed plugin tarball via POST /api/v1/admin/plugins, mint a key, drive a real chat completion)
# — a blocking client keeps that test synchronous, no tokio runtime needed. Same major version
# busbar's own `busbar` crate pins, rustls-tls only, mirroring its trimmed feature set.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Dev-only: base64-encodes the packed tarball into POST /api/v1/admin/plugins's JSON body.
base64 = "0.22"
# Dev-only: a tiny synchronous HTTP server standing in for the upstream provider, so the e2e test can
# capture the exact request body busbar forwarded (proving the compression actually landed on the
# wire), without needing a whole axum/tokio server stack in a blocking test.
tiny_http = "0.12"

# Regression witnesses share the exact YAML package selected by the SDK below.
serde_yaml_ng = "0.10"

# Bounded dependency corrections; provenance and local deltas are in vendor/README.md.
[patch.crates-io]
serde_yaml_ng = { path = "vendor/serde-yaml-ng-4d41b14" }
tokenizers = { path = "vendor/tokenizers-0.23.2" }
