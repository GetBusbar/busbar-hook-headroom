# RENDERED by `cargo xtask fleet render busbar-hook-headroom` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. The CI itself is
# busbar's plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref).
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@584b6cefb9667372e13e95bee57b883f2cc909b8
    with:
      service: none
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
      plugin_crate: busbar-hook-headroom
      plugin_kind: hook
      plugin_alias: headroom
    secrets: inherit
