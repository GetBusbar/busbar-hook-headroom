# RENDERED by `cargo xtask fleet render busbar-hook-headroom` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    tags: ["v*", "!v*-*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      service: none
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      plugin_crate: headroom-hook
      manifest_name: busbar-headroom
      plugin_alias: headroom
      plugin_kind: hook
      asset_prefix: busbar-headroom
      description: "Compresses LLM chat history with the real headroom-core BM25 TextCrusher engine as a prompt:rw rewrite gate: a busbar first-party kind:hook plugin (dlopen cdylib)."
      lib_only: true
      needs_prompt: "rw"
      needs_user: ""
      declares_file: "declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@7a5b429041752e00375e120ab1547a8928c3dee4
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-headroom
      plugin_name: busbar-headroom
      plugin_alias: headroom
      plugin_kind: hook
      bundle_image: "getbusbar/busbar-headroom"
      bundle_env: "ANTHROPIC_KEY=sk-ant-consumer-verify-dummy BUSBAR_ADMIN_TOKEN=consumer-verify-dummy"
    secrets: inherit
