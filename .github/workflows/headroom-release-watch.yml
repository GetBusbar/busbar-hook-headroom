# Watch upstream headroom (headroomlabs-ai/headroom) for a NEW release and, when one appears that is
# newer than what we're built against, bump our `headroom-core` pin to that release TAG, prove it
# builds + tests green (lexical / no-ml), then bump our own patch version and push the commit to
# `dev` and open (or update) a PR to `main`. Tagging + republishing (docker.yml/release.yml) happens
# separately, in headroom-release-publish.yml, only once that PR is actually merged — see that
# file's header for why.
#
# Deliberately does NOT touch `main` directly: it isn't a repo admin, so pushing straight to a
# protected main via GITHUB_TOKEN doesn't actually work (required-review branch protection blocks
# it, same as it would for any non-admin). `dev` has no such protection, which is the point of the
# split — see RELEASING.md.
#
# Why polling (not a webhook): we don't control headroomlabs-ai/headroom, so their side can't dispatch
# to us. A daily poll is the realistic catch. Manual `workflow_dispatch` is provided for an immediate run.
#
# FLOOR = the last headroom release that PREDATES the `ml`-feature gate (#2165). Only releases strictly
# newer than the floor carry the gate, so we never bump onto a pre-gate release (which would drag the
# whole ONNX stack back in). Until the first post-gate release ships we stay pinned to the merge commit.
name: headroom-release-watch

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily (off the :00 pileup)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  UPSTREAM: headroomlabs-ai/headroom
  FLOOR: v0.31.0

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.resolve.outputs.bump }}
      latest: ${{ steps.resolve.outputs.latest }}
      source: ${{ steps.source.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: headroom-hook
          fetch-depth: 0
          persist-credentials: false
      - id: source
        working-directory: headroom-hook
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve busbar ref
        id: ref
        run: echo "sha=$(cut -d' ' -f1 headroom-hook/.busbar-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.ref.outputs.sha }}
          path: busbar
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Resolve latest upstream release and current pin
        id: resolve
        working-directory: headroom-hook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          export LATEST
          python3 - <<'PYTHON'
          import os, re, tomllib
          def version(tag):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              if not match:
                  raise SystemExit("expected a stable vMAJOR.MINOR.PATCH release")
              return tuple(map(int, match.groups()))
          manifest = tomllib.load(open("Cargo.toml", "rb"))
          current = manifest["dependencies"]["headroom-core"].get("tag")
          latest = os.environ["LATEST"]
          newer = version(latest) > version(os.environ["FLOOR"])
          if current:
              newer = newer and version(latest) > version(current)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"latest={latest}\nbump={'yes' if newer else 'no'}\n")
          PYTHON
      # No write token or persisted checkout credentials enter the upstream build job.
      - name: Bump dependency and prove the lexical build
        id: bump
        if: steps.resolve.outputs.bump == 'yes'
        working-directory: headroom-hook
        env:
          LATEST: ${{ steps.resolve.outputs.latest }}
          BUSBAR_CHECKOUT: ${{ github.workspace }}/busbar
          BUSBAR_TARGET_DIR: ${{ github.workspace }}/busbar-target
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, pathlib, re
          path = pathlib.Path("Cargo.toml")
          text, count = re.subn(r'^headroom-core = \{[^}]*\}',
              'headroom-core = { git = "https://github.com/headroomlabs-ai/headroom", tag = "' + os.environ["LATEST"] + '", default-features = false }',
              path.read_text(), flags=re.M)
          if count != 1:
              raise SystemExit("expected exactly one headroom-core dependency")
          path.write_text(text)
          PYTHON
          cargo update -p headroom-core
          new="$(bash .github/scripts/next-version.sh)"; new="${new#v}"
          bash .github/scripts/stamp-version.sh "$new"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          cargo build --release --locked
          cargo test --locked
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.bump == 'yes'
        with:
          name: headroom-dependency
          path: |
            headroom-hook/Cargo.toml
            headroom-hook/Cargo.lock
          if-no-files-found: error

  publish:
    needs: watch
    if: needs.watch.outputs.bump == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # A fresh checkout owns the writer's scripts. Never execute the candidate or Cargo here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.watch.outputs.source }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: headroom-dependency
          path: candidate
      - name: Publish the tested dependency update
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.watch.outputs.latest }}
          VERSION: ${{ needs.watch.outputs.version }}
        run: |
          set -euo pipefail
          cp candidate/Cargo.toml Cargo.toml
          cp candidate/Cargo.lock Cargo.lock
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          new="$VERSION"
          git config user.name "headroom-release-watch"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(deps): headroom-core -> ${LATEST}; headroom-hook v${new}"
          # Fast-forward only: a concurrent dev update refuses this stale candidate.
          git push origin HEAD:dev
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref dev
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head dev \
              --reviewer MattJackson \
              --title "Release: headroom-hook v${new} (headroom-core ${LATEST})" \
              --body "Bumps headroom-core to ${LATEST} and headroom-hook to v${new}. The dependency passed the lexical build and tests in a read-only job."
          fi
