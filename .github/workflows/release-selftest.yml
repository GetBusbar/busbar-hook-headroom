# CI self-test for the release-on-upstream version-compute logic.
# Runs the REAL .github/scripts/next-version.sh against synthetic repos and asserts it produces a
# valid next version for BOTH the has-prior-tag and no-prior-tag cases — WITHOUT publishing anything.
# This is what keeps the release automation from silently rotting before the fleet fan-out is armed.
name: release-selftest

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/next-version.sh"
      - ".github/scripts/repin-busbar.sh"
      - ".github/scripts/stamp-version.sh"
      - ".github/workflows/release-selftest.yml"
      - ".github/workflows/release-on-upstream.yml"

permissions:
  contents: read

jobs:
  next-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the repo's own tags, for the "this repo, today" assertion
      - name: version-compute self-test (no publish)
        run: |
          set -euo pipefail
          script="$PWD/.github/scripts/next-version.sh"
          test -f "$script" || { echo "::error::missing $script"; exit 1; }

          fail() { echo "::error::$*"; exit 1; }
          assert_eq() { [ "$1" = "$2" ] || fail "expected '$2' got '$1' ($3)"; }

          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" config user.email t@t
          git -C "$work" config user.name  t

          # ── no-prior-tag (FIRST RELEASE) ──────────────────────────────────────
          got="$(cd "$work" && INITIAL_VERSION=1.0.0 bash "$script")"
          assert_eq "$got" "v1.0.0" "no-tag default"
          got="$(cd "$work" && INITIAL_VERSION=2.3.0 bash "$script")"
          assert_eq "$got" "v2.3.0" "no-tag custom initial"

          # ── has-prior-tag (patch-bump the highest v* tag) ─────────────────────
          git -C "$work" commit -q --allow-empty -m seed
          git -C "$work" tag v1.0.0
          git -C "$work" tag v1.0.9
          git -C "$work" tag v1.2.9
          got="$(cd "$work" && bash "$script")"
          assert_eq "$got" "v1.2.10" "patch-bump highest tag"

          # ── explicit version passthrough ──────────────────────────────────────
          got="$(cd "$work" && INPUT_VERSION=3.4.5 bash "$script")"
          assert_eq "$got" "v3.4.5" "explicit version"
          got="$(cd "$work" && INPUT_VERSION=v3.4.5 bash "$script")"
          assert_eq "$got" "v3.4.5" "explicit version with leading v"

          # ── the crate's declared version (root Cargo.toml [package]) ──────────
          # The next tag is the greater of the tag bump and Cargo.toml, so it is above every tag
          # and never below what the crate declares (the v2.0.8-vs-2.0.22 split this repo had).
          printf '[package]\nname = "x"\nversion = "1.2.30"\n\n[dependencies]\nfoo = { version = "9.9.9" }\n' > "$work/Cargo.toml"
          got="$(cd "$work" && bash "$script")"
          assert_eq "$got" "v1.2.30" "declared version above the highest tag wins"
          git -C "$work" tag v1.2.30
          got="$(cd "$work" && bash "$script")"
          assert_eq "$got" "v1.2.31" "declared version already tagged -> patch-bump"
          printf '[package]\nname = "x"\nversion = "1.0.0"\n' > "$work/Cargo.toml"
          got="$(cd "$work" && bash "$script")"
          assert_eq "$got" "v1.2.31" "declared version below the highest tag -> patch-bump"
          got="$(cd "$work" && INPUT_VERSION=9.0.0 bash "$script")"
          assert_eq "$got" "v9.0.0" "explicit version still wins"
          # This repo, today: above every existing tag and not below Cargo.toml.
          got="$(bash "$script")"
          latest="$(git tag --list 'v*' | sort -V | tail -1)"
          declared="v$(awk '/^\[package\]/{p=1; next} /^\[/{p=0} p && /^version *= *"/{gsub(/.*= *"|".*/, ""); print; exit}' Cargo.toml)"
          [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$got" | sort -V | tail -1)" = "$got" ] && [ "$got" != "$latest" ] \
            || fail "next tag $got is not above the highest tag $latest"
          [ "$(printf '%s\n%s\n' "$declared" "$got" | sort -V | tail -1)" = "$got" ] || fail "next tag $got is below Cargo.toml $declared"
          echo "this repo: next tag $got (highest tag ${latest:-none}, Cargo.toml $declared)"

          echo "all version-compute self-tests passed (no-prior-tag, has-prior-tag, declared Cargo.toml version)"

  # The data path release-on-upstream runs on a real cut: repin-busbar.sh moves .busbar-ref, every
  # manifest's busbar git `rev` and Cargo.lock together. Proven on a scratch copy by moving the pin
  # to the pinned commit's PARENT (a real busbar commit that exists on GitHub) and back — nothing is
  # committed or pushed.
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: repin self-test (no commit, no push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          script=.github/scripts/repin-busbar.sh
          pin="$(cut -d' ' -f1 .busbar-ref)"; ver="$(cut -d' ' -f2 .busbar-ref)"
          parent="$(gh api "repos/GetBusbar/busbar/commits/${pin}" --jq '.parents[0].sha')"
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]] || fail "could not resolve the pin's parent commit"

          # RED arms: a short sha and a missing version are refused, by name, before anything is
          # written. (Output captured so the expected refusal is not raised as a run annotation.)
          if out="$(bash "$script" "${pin:0:9}" "$ver" 2>&1)"; then fail "a short sha was accepted"; fi
          grep -q "is not a full 40-hex busbar sha" <<<"$out" || fail "short sha refused for the wrong reason: $out"
          if out="$(bash "$script" "$pin" "" 2>&1)"; then fail "an empty version was accepted"; fi
          grep -q "usage: repin-busbar.sh" <<<"$out" || fail "empty version refused for the wrong reason: $out"
          git diff --exit-code || fail "a refused repin wrote files"

          # --decide (release-on-upstream's "did upstream move?"), against the recorded pin:
          #   same version + same sha -> skip; same version + DIFFERENT sha -> cut (the upstream
          #   release commit moved under an unchanged version string); newer version -> cut;
          #   older version / no incoming version / same version with no sha -> skip.
          decide() { bash "$script" --decide "$1" "$2" 2>/dev/null; }
          [ "$(decide "$pin" "$ver")" = skip ]       || fail "same version + same sha must skip"
          [ "$(decide "$parent" "$ver")" = cut ]     || fail "same version + different sha must cut"
          [ "$(decide "$parent" "v$ver")" = cut ]    || fail "a leading v must not hide a moved commit"
          [ "$(decide "" "$ver")" = skip ]           || fail "same version with no incoming sha must skip"
          [ "$(decide "$parent" "999.0.0")" = cut ]  || fail "a newer version must cut"
          [ "$(decide "$parent" "0.0.1")" = skip ]   || fail "an older version must skip"
          [ "$(decide "$parent" "")" = skip ]        || fail "no incoming version must skip"
          if bash "$script" --decide "${parent:0:9}" "$ver" >/dev/null 2>&1; then fail "--decide accepted a short sha"; fi

          # The recorded pin is a fixed point.
          bash "$script" "$pin" "$ver"
          git diff --exit-code || fail "re-pinning to the recorded rev changed files"

          # A real move: record, manifests and lock all name the new rev, and nothing else moved.
          bash "$script" "$parent" "$ver"
          [ "$(cut -d' ' -f1 .busbar-ref)" = "$parent" ] || fail ".busbar-ref did not move"
          ! grep -rq --include=Cargo.toml "$pin" . || fail "a manifest still names the old rev"
          ! grep -q "$pin" Cargo.lock || fail "Cargo.lock still names the old rev"
          git diff --name-only | grep -vE '(^|/)Cargo\.(toml|lock)$|^\.busbar-ref$' && fail "repin touched a file outside the pin" || true

          # And back: byte-identical to the committed tree.
          bash "$script" "$pin" "$ver"
          git diff --exit-code || fail "moving the pin away and back is not a round trip"
          echo "repin self-test passed (decide: same-version moved commit cuts, same commit skips; refusals, fixed point, real move, round trip)"
